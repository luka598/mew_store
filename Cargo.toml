[package]
name = "mew_store"
version = "0.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
